<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELITE CLASS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#eee;font-family:Arial;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(560px,100%);background:#121212;border:1px solid #292929;border-radius:24px;padding:30px;text-align:center;box-shadow:0 20px 70px #000}.logo{font-size:32px;font-weight:800;letter-spacing:5px}.sub{color:#888;margin:8px 0 26px}.status{font-size:19px;font-weight:700;margin:16px}.online{color:#36e27b}.waiting{color:#ffc247}.error{color:#ff6262}#qr{display:none;width:min(360px,90%);margin:22px auto;background:#fff;padding:12px;border-radius:16px}.instructions{color:#aaa;line-height:2}.badge{display:inline-block;margin-top:18px;padding:7px 12px;border-radius:99px;background:#1c1c1c;color:#888;font-size:12px}</style></head><body><main class="card"><div class="logo">🎓 ELITE CLASS</div><div class="sub">WhatsApp Control Panel</div><div id="status" class="status waiting">⏳ جاري التشغيل...</div><img id="qr" alt="WhatsApp QR"><div id="instructions" class="instructions">جاري تجهيز Chromium وWhatsApp Web...</div><div class="badge">Selenium • Chromium • Flask</div></main><script>async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'}),d=await r.json(),s=document.getElementById('status'),q=document.getElementById('qr'),i=document.getElementById('instructions');if(d.connected){s.textContent='🟢 WhatsApp متصل';s.className='status online';q.style.display='none';i.textContent='البوت يعمل الآن.'}else{s.textContent=(d.error?'🔴 ':'🟡 ')+d.message;s.className='status '+(d.error?'error':'waiting');if(d.qr){q.src='data:image/png;base64,'+d.qr;q.style.display='block';i.innerHTML='افتح WhatsApp في هاتفك<br>الإعدادات → الأجهزة المرتبطة → ربط جهاز<br>ثم امسح رمز QR.'}else{q.style.display='none';i.textContent='انتظر حتى يظهر رمز QR...'}}}catch(e){console.error(e)}}setInterval(refresh,2000);refresh();</script></body></html>
