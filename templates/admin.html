<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELITE CLASS — الإدارة</title><style>body{margin:0;background:#070707;color:#eee;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{width:min(700px,90%);padding:40px;background:#121212;border:1px solid #292929;border-radius:24px;text-align:center}.logo{font-size:34px;font-weight:bold;letter-spacing:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:30px}.box{padding:24px;background:#1b1b1b;border-radius:16px}.value{font-size:20px;font-weight:bold;margin-top:10px}.link{display:inline-block;margin-top:30px;padding:14px 22px;border-radius:12px;background:#eee;color:#111;text-decoration:none;font-weight:bold}.ok{color:#35df7a}.wait{color:#ffc247}</style></head><body><main class="card"><div class="logo">🎓 ELITE CLASS</div><p>لوحة إدارة البوت</p><div class="grid"><div class="box">الحالة<div id="status" class="value wait">...</div></div><div class="box">النظام<div class="value">Selenium + Chromium</div></div></div><a class="link" href="/qr" target="_blank">📱 فتح شاشة ربط WhatsApp</a></main><script>async function u(){try{let d=await (await fetch('/api/status',{cache:'no-store'})).json();let s=document.getElementById('status');s.textContent=d.connected?'🟢 متصل':'🟡 '+d.message;s.className='value '+(d.connected?'ok':'wait')}catch(e){}}setInterval(u,2000);u();</script></body></html>
