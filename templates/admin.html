<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070707;color:#eee;font-family:Arial}.w{width:min(950px,94%);margin:30px auto}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:bold;letter-spacing:4px}.btn{display:inline-block;padding:11px 15px;background:#eee;color:#111;border-radius:10px;text-decoration:none;border:0;cursor:pointer}.card{background:#121212;border:1px solid #292929;border-radius:18px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.n{font-size:22px;font-weight:bold;margin-top:8px}.d{color:#aaa;line-height:2}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style><div class=w><div class=top><div><div class=logo>🎓 ELITE CLASS</div><div style=color:#888>Control Center</div></div><div><a class=btn href=/pair target=_blank>📱 شاشة الربط</a><a class=btn href=/logout>خروج</a></div></div><div class=grid><div class=card>Chromium<div id=a class=n>...</div></div><div class=card>WhatsApp<div id=b class=n>...</div></div><div class=card>Pairing<div id=c class=n>...</div></div><div class=card>Code<div id=e class=n>...</div></div></div><div class=card><h2>🔧 Diagnostics</h2><div id=d class=d>...</div><form method=post action=/admin/restart><button class=btn>إعادة تشغيل Selenium</button></form></div></div><script>async function u(){let x=await(await fetch('/api/status')).json();a.textContent=x.ready?'🟢':'🔴';b.textContent=x.connected?'🟢 متصل':'🟡 انتظار';c.textContent=x.pairing_requested?'🟢 مطلوب':'⚪';e.textContent=x.pairing_code||'—';d.innerHTML='الرسالة: '+x.message+'<br>الهاتف: '+(x.phone||'-')+'<br>URL: '+(x.url||'-')+'<br>Title: '+(x.title||'-')+'<br>الخطأ: '+(x.error||'لا يوجد')}setInterval(u,2000);u();</script>
