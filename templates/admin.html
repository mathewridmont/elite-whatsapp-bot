<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELITE CLASS Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:Arial}.wrap{width:min(1050px,94%);margin:30px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:30px;font-weight:bold;letter-spacing:4px}.btn{display:inline-block;padding:11px 15px;border-radius:10px;background:#eee;color:#111;text-decoration:none;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.card{background:#121212;border:1px solid #292929;border-radius:18px;padding:20px}.num{font-size:22px;font-weight:bold;margin-top:10px}.ok{color:#35df7a}.warn{color:#ffc247}.diag{line-height:2;color:#aaa}.danger{background:#301414;color:#fff;margin-right:8px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}</style><div class=wrap><div class=top><div><div class=logo>🎓 ELITE CLASS</div><div style="color:#888">Control Center</div></div><div><a class=btn href="/qr" target="_blank">📱 شاشة WhatsApp</a><a class=btn href="/logout">خروج</a></div></div><div class=grid><div class=card>Chromium<div id=c class="num warn">...</div></div><div class=card>WhatsApp<div id=w class="num warn">...</div></div><div class=card>QR<div id=q class="num warn">...</div></div><div class=card>Page<div id=p class="num warn">...</div></div></div><div class=card><h2>🔧 Diagnostics</h2><div id=d class=diag>...</div><br><a class=btn href="/qr" target="_blank">فتح التشخيص المرئي</a><form method=post action="/admin/restart-whatsapp" style="display:inline"><button class="btn danger">إعادة تشغيل WhatsApp</button></form></div></div><script>async function u(){try{let x=await(await fetch('/api/status')).json();c.textContent=x.chrome?'🟢 يعمل':'🔴';w.textContent=x.connected?'🟢 متصل':'🟡 انتظار';q.textContent=x.qr?'🟢 موجود':'🔴';p.textContent=x.page_loaded?'🟢 محملة':'🟡';d.innerHTML='الرسالة: '+x.message+'<br>QR source: '+x.qr_source+'<br>Title: '+(x.title||'-')+'<br>URL: '+(x.url||'-')+'<br>الخطأ: '+(x.error||'لا يوجد')}catch(e){}}setInterval(u,2000);u();</script>
