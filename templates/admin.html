<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070707;color:#eee;font-family:Arial}.w{width:min(1000px,94%);margin:30px auto}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:bold;letter-spacing:4px}.btn{display:inline-block;padding:11px 15px;background:#eee;color:#111;border-radius:10px;text-decoration:none;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.card{background:#121212;border:1px solid #292929;border-radius:18px;padding:20px;margin-top:18px}.n{font-size:20px;font-weight:bold;margin-top:8px}.d{color:#aaa;line-height:2;word-break:break-word}.danger{background:#381313;color:#fff;margin-right:8px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.top{flex-direction:column;align-items:flex-start;gap:10px}}</style><div class=w><div class=top><div><div class=logo>🎓 ELITE CLASS</div><div style=color:#888>V8 • Phone First</div></div><div><a class=btn href=/pair target=_blank>📱 الربط بالهاتف</a><a class=btn href=/logout>خروج</a></div></div><div class=grid><div class=card>Chrome<div id=a class=n>...</div></div><div class=card>Stage<div id=b class=n>...</div></div><div class=card>WhatsApp<div id=c class=n>...</div></div><div class=card>Code<div id=e class=n>...</div></div></div><div class=card><h2>🔧 Diagnostics</h2><div id=d class=d>...</div><form method=post action=/admin/restart><button class="btn danger">إعادة تشغيل Chrome</button></form></div></div><script>async function u(){let x=await(await fetch('/api/status')).json();a.textContent=x.ready?'🟢':'🔴';b.textContent=x.stage;c.textContent=x.connected?'🟢 متصل':'🟡';e.textContent=x.code||'—';d.innerHTML='الرسالة: '+x.message+'<br>Phone: '+(x.phone||'-')+'<br>Chrome: '+(x.chrome||'-')+'<br>Driver: '+(x.driver||'-')+'<br>URL: '+(x.url||'-')+'<br>Title: '+(x.title||'-')+'<br>Error: '+(x.error||'لا يوجد')}setInterval(u,1500);u();</script>
