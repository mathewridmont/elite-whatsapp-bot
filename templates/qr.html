<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ربط WhatsApp — ELITE CLASS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#eee;font-family:Arial;display:flex;justify-content:center;align-items:center;padding:20px}.card{width:min(520px,100%);background:#121212;border:1px solid #292929;border-radius:24px;padding:30px;text-align:center;box-shadow:0 20px 70px #000}.logo{font-size:30px;font-weight:bold;letter-spacing:4px}.status{font-size:20px;font-weight:bold;margin:18px}.wait{color:#ffc247}.ok{color:#35df7a}.err{color:#ff6262}#qr{display:none;width:min(360px,90%);background:white;padding:12px;border-radius:16px;margin:20px auto}.instructions{color:#aaa;line-height:2}.back{display:inline-block;margin-top:22px;color:#aaa;text-decoration:none}</style></head><body><main class="card"><div class="logo">📱 WHATSAPP LINK</div><div id="status" class="status wait">⏳ جاري تشغيل Selenium...</div><img id="qr" alt="WhatsApp QR"><div id="instructions" class="instructions">جاري تجهيز رمز الربط...</div><a class="back" href="/">← لوحة الإدارة</a></main><script>async function u(){try{let d=await (await fetch('/api/status',{cache:'no-store'})).json(),s=document.getElementById('status'),q=document.getElementById('qr'),i=document.getElementById('instructions');if(d.connected){s.textContent='🟢 تم ربط WhatsApp بنجاح';s.className='status ok';q.style.display='none';i.textContent='الحساب متصل والبوت يعمل.'}else{s.textContent=(d.error?'🔴 ':'🟡 ')+d.message;s.className='status '+(d.error?'err':'wait');if(d.qr){q.src='data:image/png;base64,'+d.qr;q.style.display='block';i.innerHTML='افتح WhatsApp في هاتفك<br>الإعدادات → الأجهزة المرتبطة → ربط جهاز<br>ثم امسح رمز QR الموجود أعلاه.'}else{q.style.display='none';i.textContent='انتظر ظهور رمز QR...'}}}catch(e){}}setInterval(u,2000);u();</script></body></html>
