<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Link</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:Arial;min-height:100vh;display:grid;place-items:center;padding:15px}.box{width:min(700px,100%);background:#121212;border:1px solid #292929;border-radius:24px;padding:25px;text-align:center}.logo{font-size:28px;font-weight:bold;letter-spacing:4px}.status{font-size:20px;margin:15px}.ok{color:#35df7a}.wait{color:#ffc247}.bad{color:#ff6262}.qr{max-width:390px;width:92%;background:#fff;padding:10px;border-radius:15px;margin:10px auto}.shot{max-width:100%;border-radius:15px;margin-top:12px}.diag{text-align:right;background:#090909;padding:14px;border-radius:14px;color:#aaa;font-size:13px;line-height:1.9;margin-top:15px}.hint{color:#999;line-height:1.9}.back{color:#888;display:block;margin-top:18px}</style><main class=box><div class=logo>📱 WHATSAPP LINK</div><div id=s class="status wait">جاري التشغيل...</div><div id=i class=hint>انتظر...</div><img id=q class=qr style="display:none"><img id=shot class=shot style="display:none"><div id=d class=diag>جاري التشخيص...</div><a class=back href="/admin">← الإدارة</a></main><script>async function u(){try{let x=await(await fetch('/api/status',{cache:'no-store'})).json(),s=document.getElementById('s'),i=document.getElementById('i'),q=document.getElementById('q'),sh=document.getElementById('shot');s.textContent=x.connected?'🟢 WhatsApp متصل':(x.error?'🔴 '+x.error:'🟡 '+x.message);s.className='status '+(x.connected?'ok':x.error?'bad':'wait');if(x.connected){q.style.display='none';sh.style.display='none';i.textContent='تم الربط، البوت جاهز.'}else if(x.qr){q.src='data:image/png;base64,'+x.qr;q.style.display='block';sh.style.display='none';i.innerHTML='افتح WhatsApp ← الأجهزة المرتبطة ← ربط جهاز ← امسح QR.'}else if(x.screenshot){q.style.display='none';sh.src='data:image/png;base64,'+x.screenshot;sh.style.display='block';i.textContent='لم أجد عنصر QR. هذه لقطة حية لما يراه Chromium؛ استخدمها للتشخيص.'}else{i.textContent='لم تصل لقطة من Chromium بعد.'}document.getElementById('d').innerHTML='Chromium: '+(x.chrome?'🟢':'🔴')+'<br>Page loaded: '+(x.page_loaded?'🟢':'🔴')+'<br>QR source: '+x.qr_source+'<br>Title: '+(x.title||'-')+'<br>URL: '+(x.url||'-')}</script><script>setInterval(u,2000);u();</script>
