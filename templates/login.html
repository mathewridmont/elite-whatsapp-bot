<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{background:#070707;color:#eee;font-family:Arial;display:grid;place-items:center;min-height:100vh}.b{width:min(380px,90%);background:#121212;padding:25px;border-radius:20px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#1b1b1b;color:#fff}button{background:#eee;color:#111;font-weight:bold}.e{color:#f66}</style><div class=b><h1>ELITE CLASS</h1><p>الدخول</p>{%if error%}<p class=e>{{error}}</p>{%endif%}<form method=post><input name=username placeholder="اسم المستخدم" required><input name=password type=password placeholder="كلمة المرور" required><button>دخول</button></form></div>
