<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>WhatsApp Phone Pairing</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:Arial;min-height:100vh;display:grid;place-items:center;padding:16px}.b{width:min(720px,100%);background:#121212;border:1px solid #292929;border-radius:24px;padding:28px;text-align:center}.logo{font-size:28px;font-weight:bold;letter-spacing:3px}input,button{width:100%;padding:14px;border-radius:11px;border:1px solid #333;background:#1b1b1b;color:#fff;margin:7px 0}button{background:#eee;color:#111;font-weight:bold}.code{font-size:44px;letter-spacing:7px;font-weight:bold;padding:22px;background:#080808;border-radius:18px;margin:20px 0}.ok{color:#35df7a}.warn{color:#ffc247}.bad{color:#f66}.shot{max-width:100%;border-radius:14px;margin-top:18px}.diag{text-align:right;color:#999;background:#090909;border-radius:14px;padding:14px;line-height:1.8;margin-top:16px;font-size:12px}.muted{color:#888;line-height:1.8}</style><main class=b><div class=logo>📱 PHONE PAIRING</div><p class=muted>أدخل رقم WhatsApp مع رمز الدولة، ثم سيضغط التطبيق تلقائيًا على «Log in with phone number» ويدخل الرقم.</p><form id=f><input id=phone inputmode=numeric placeholder="249XXXXXXXXX" required><button>بدء الربط برقم الهاتف</button></form><div id=s class=warn>جاري تشغيل Chrome...</div><div id=c class=code style=display:none></div><p id=i class=muted>لم يبدأ الربط بعد.</p><img id=im class=shot style=display:none><div id=d class=diag>...</div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'phone='+encodeURIComponent(phone.value)}),x=await r.json();i.textContent=x.ok?'بدأ الربط. اترك الصفحة مفتوحة.':x.error};async function u(){try{let x=await(await fetch('/api/status',{cache:'no-store'})).json();s.textContent=x.connected?'🟢 WhatsApp متصل':(x.error?'🔴 '+x.error:'🟡 '+x.message);s.className=x.connected?'ok':x.error?'bad':'warn';if(x.code){c.style.display='block';c.textContent=x.code;i.textContent='تم التحقق من الكود داخل صفحة WhatsApp.'}else c.style.display='none';if(x.screenshot){im.src=x.screenshot;im.style.display='block'}d.innerHTML='المرحلة: '+x.stage+'<br>Chrome: '+(x.chrome||'-')+'<br>Driver: '+(x.driver||'-')+'<br>URL: '+(x.url||'-')+'<br>الخطأ: '+(x.error||'لا يوجد')}catch(e){}}setInterval(u,1500);u();</script>
